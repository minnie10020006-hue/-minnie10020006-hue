<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JY</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a class="logo" href="index.html" aria-label="JY 首頁">
      <img src="img/logo.png" alt="JY logo">
    </a>

    <nav aria-label="主選單">
      <ul class="nav-links">
        <li><a href="#">關於</a></li>
        <li><a href="#">作品</a></li>
        <li><a href="#">周邊</a></li>
        <li><a href="#">聯絡</a></li>
        <li><a href="#">登入</a></li>
      </ul>

      <ul class="nav-icons">
        <li><a href="index.html" aria-label="首頁"><img src="img/home.png" alt="首頁"></a></li>
        <!-- 注意:實際圖形與檔名相反 → download.png 是「重新整理」箭頭、menu.png 是「下載」、refresh.png 是「漢堡選單」 -->
        <li><a href="#" aria-label="重新整理"><img src="img/download.png" alt="重新整理"></a></li>
        <li><a href="#" aria-label="下載"><img src="img/menu.png" alt="下載"></a></li>
        <li><a href="#" aria-label="選單"><img src="img/refresh.png" alt="選單"></a></li>
      </ul>
    </nav>
  </header>

  <main class="home">
    <!-- Banner:上緣與 header 重疊,與設計圖相同 -->
    <section class="banner">
      <img src="img/banner.png" alt="2026 箱中巡遊慶典 4.0版本「應門者」現已開啟">
    </section>

    <!-- 內容範圍區域(原稿紅框僅為範圍標示,不顯示) -->
    <section class="content about">
      <h1>關於重返未來1999</h1>

      <div class="cards">
        <article class="card">
          <h2>種族</h2>
          <ul>
            <li>神祕學家</li>
            <li>神祕學家混血種</li>
            <li>神祕學家純血種</li>
            <li>神祕學家感染種</li>
            <li>超自然者</li>
            <li>意識喚醒者</li>
            <li>人類</li>
          </ul>
        </article>

        <article class="card">
          <h2>陣營</h2>
          <ul>
            <li>聖洛夫基金會</li>
            <li>拉普拉斯科算中心</li>
            <li>人類第一防線學校</li>
            <li>芝諾軍備學校</li>
            <li>洛倫茲研究所</li>
            <li>司辰小隊</li>
            <li>重塑之手</li>
          </ul>
        </article>

        <article class="card">
          <h2>設定</h2>
          <ul>
            <li>暴雨</li>
            <li>暴雨症候</li>
            <li>神祕學</li>
            <li>神秘術</li>
          </ul>
        </article>
      </div>
    </section>
  </main>

  <footer></footer>

</body>
</html>
